<!DOCTYPE html> 
<html lang="en"> 
 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
 
    <title>StudyFlow</title> 
 
    <link rel="stylesheet" href="style.css"> 
</head> 
 
<body> 
 
    <div class="container"> 
 
        <header> 
            <h1>StudyFlow</h1> 
            <p>Plan smarter || Study better.</p> 
        </header> 
 
        <section class="dashboard"> 
 
            <div class="stat-card"> 
                <span class="stat-label">Total Tasks</span> 
                <h3 id="totalTasks">0</h3> 
            </div> 
 
            <div class="stat-card"> 
                <span class="stat-label">Completed</span> 
                <h3 id="completedTasks">0</h3> 
            </div> 
 
            <div class="stat-card"> 
                <span class="stat-label">High Priority</span> 
                <h3 id="highPriorityTasks">0</h3> 
            </div> 
 
            <div class="stat-card progress-card"> 
 
                <div> 
                    <span class="stat-label">Weekly Progress</span> 
                    <p class="progress-message">وما نيل المطالب بالتمني</p> 
                </div> 
 
                <div class="progress-wheel" id="progressWheel"> 
                    <div class="progress-inner"> 
                        <span id="progressValue">0%</span> 
                    </div> 
                </div> 
 
            </div> 
 
        </section> 
 
        <section class="task-form"> 
 
            <h2>Add a New Task</h2> 
 
            <input 
                type="text" 
                id="taskName" 
                placeholder="Task name" 
            > 
 
            <input 
                type="text" 
                id="subject" 
                placeholder="Subject" 
            > 
 
            <select id="priority"> 
                <option value="high">High Priority</option> 
                <option value="medium">Medium Priority</option> 
                <option value="low">Low Priority</option> 
            </select> 
 
            <input 
                type="date" 
                id="deadline" 
            > 
 
            <button id="addTaskBtn"> 
                Add Task 
            </button> 
 
        </section> 
 
        <section class="tasks-section"> 
 
            <div class="tasks-header"> 
 
                <div> 
                    <h2>My Tasks</h2> 
                    <p>Keep it up!</p> 
                </div> 
 
                <select id="taskFilter"> 
                    <option value="all">All Tasks</option> 
                    <option value="pending">Pending</option> 
                    <option value="completed">Completed</option> 
                </select> 
 
            </div> 
 
            <div id="taskList" class="task-list"> 
 
                <div class="empty-state"> 
                    <h3>No tasks yet</h3> 
                    <p>Add your first task and start making progress.</p> 
                </div> 
 
            </div> 
 
        </section> 
 
    </div> 
 
    <script src="script.js"></script> 
 
</body> 
 
</html>
